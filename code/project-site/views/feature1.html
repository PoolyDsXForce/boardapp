  <h1>Feature 1 – Launch the Application</h1>

  <h2>Description</h2>
  <p>This feature demonstrates how to start the JavaFX application using Maven.</p>

  <h2>Steps</h2>
  <ol>
    <li>Open a terminal inside the project folder.</li>
    <li>Run the command:
      <pre>mvn javafx:run</pre>
    </li>
    <li>The JavaFX window will open.</li>
  </ol>
